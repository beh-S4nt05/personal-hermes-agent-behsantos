[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betterme-agent"
version = "6.4.0"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]
description = "Agente local via terminal com Ollama (Betterme) e GUI web — Windows | macOS | Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
whatsapp = ["playwright>=1.40"]

[project.scripts]
betterme = "betterme.cli:main"
hermes = "betterme.cli:main"        # alias legado (v4.0 e anteriores)

[tool.setuptools.packages.find]
include = ["betterme*"]

[tool.setuptools.package-data]
"betterme.server" = ["templates/*.html"]
