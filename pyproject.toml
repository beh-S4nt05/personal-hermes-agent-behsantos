[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "3.8.0"
description = "Agente Linux via terminal com Ollama (Hermes) e GUI web para ligar/desligar"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
    "waitress>=3.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.server" = ["templates/*.html"]
